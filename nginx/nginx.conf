# Reverse proxy for the self-hosted origin.
#
# Deliberately does NOT set security headers. They are sent by the application
# (src/middleware.ts) so that all three origins are provably identical; adding
# a second copy here is how the two silently diverge, and duplicated headers
# are also how you end up with two conflicting CSPs on one response.
#
# What nginx owns here is transport and abuse control at the edge — the things
# the application genuinely cannot see.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;   # do not advertise the version being run

    # Trust X-Forwarded-For only from the proxy in front of this box.
    #
    # This is load-bearing for security, not just for logging: the contact
    # endpoint derives its rate-limit key from the client address, so if this
    # is wrong or absent, any caller can set the header themselves and mint a
    # fresh quota per request. Replace with the real upstream range.
    set_real_ip_from  10.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    log_format  main  '$remote_addr - $status "$request" '
                      '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log main;

    gzip              on;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/rss+xml;
    gzip_min_length   1024;

    # A defence-in-depth ceiling underneath the application's own limiter. If
    # Upstash is unreachable the app fails closed, but this stops the flood
    # before it costs a request.
    limit_req_zone  $binary_remote_addr zone=contact:10m rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=general:10m rate=60r/s;

    upstream app {
        server app:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        # Everything except the ACME challenge goes to HTTPS.
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name 5a8er.ir;

        ssl_certificate     /etc/letsencrypt/live/5a8er.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/5a8er.ir/privkey.pem;

        # TLS 1.2 is kept only because some corporate middleboxes still
        # terminate at it. Drop it once that stops being true.
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;

        client_max_body_size 1m;

        # Immutable, content-hashed assets. Long max-age is safe precisely
        # because the filename changes when the content does.
        location /_next/static/ {
            proxy_pass http://app;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api/contact {
            limit_req zone=contact burst=5 nodelay;
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
        }

        # The CMS is not served from this origin. It lives on one hostname
        # behind Cloudflare Access; a stray route here would be a second,
        # unauthenticated way in.
        location /keystatic     { return 404; }
        location /api/keystatic { return 404; }

        location / {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
        }
    }
}

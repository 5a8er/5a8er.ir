name: verify and deploy

# One commit, both origins. If the two ever deploy from different commits, the
# failover router will serve two different sites depending on which origin is
# healthy — so the deploy jobs both depend on a single verify job and both run
# from the same checkout.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The `min-release-age` floor in .npmrc needs npm >= 11.10; the npm
      # bundled with Node 22 is 10.x and silently ignores unknown keys, which
      # would make the supply-chain control a no-op exactly where it matters
      # most.
      - name: Use an npm that honours min-release-age
        run: npm install -g npm@latest

      - run: npm ci

      - name: Generate Workers runtime types
        run: npm run types:worker

      - run: npm run build:posts
      - run: npm run typecheck
      - run: npm test

      - name: Build Vercel target
        run: npm run build

      - name: Build Cloudflare target
        run: npm run build:cf

      # Hard gate: Cloudflare caps a free-plan Worker at 3 MiB gzipped and
      # this exits non-zero when the bundle exceeds it. Better to fail here
      # than to discover it during a deploy.
      - name: Check Worker size against the free-tier cap
        run: npm run size:cf

  deploy-cloudflare:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:cf

      - name: Deploy site Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The apex router is a separate Worker with its own lifecycle. It is
      # deployed after the site Worker so its service binding always points at
      # something that exists.
      - name: Deploy apex router Worker
        working-directory: workers/router
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-vercel:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Deploy
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Proves the deploy actually did what it claimed: identical headers on the
  # apex and on both origins directly. Runs after both, and only on main.
  verify-live:
    needs: [deploy-cloudflare, deploy-vercel]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The secret is passed through `env:` rather than interpolated into the
      # command line. `${{ }}` substitutes into the script text before the
      # shell ever sees it, so a value containing shell metacharacters would be
      # executed rather than passed as an argument.
      - name: Compare headers across apex and both origins
        env:
          VERCEL_ORIGIN_URL: ${{ secrets.VERCEL_ORIGIN_URL }}
        run: |
          chmod +x scripts/verify-headers.sh
          ./scripts/verify-headers.sh \
            https://5a8er.ir \
            https://cf.5a8er.ir \
            "$VERCEL_ORIGIN_URL"
